[package]
name = "egui_modal_with_titlebar"
version = "0.9.2"
edition = "2024"
authors = ["emabee <meinolf.block-hd@t-online.de>"]
categories = ["gui"]
description = """
A thin wrapper around `egui::Modal` that adds a title bar and an optional close button.
"""
keywords = ["UI", "egui"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/emabee/rust-egui-modal-with-titlebar"
rust-version = "1.95.0"
exclude = ["/scripts"]

[dependencies]
egui = { version = "0.36" }

[dev-dependencies]
anyhow = "1.0"
eframe = { version = "0.36" }
